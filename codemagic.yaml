# Codemagic CI/CD — build iOS y publicar en TestFlight (App Store Connect).
# Requisitos:
#  - Plataforma iOS en el proyecto (ya está).
#  - Integración "App Store Connect" en Codemagic con una API key de rol **Admin**.
#    Su nombre debe coincidir con `integrations.app_store_connect` de abajo.
#  - App creada en App Store Connect con el bundle id de abajo (Apple ID numérico en APP_STORE_APP_ID).
#  - Variable de entorno **segura** `CERTIFICATE_PRIVATE_KEY`: la clave privada RSA (PEM) del
#    certificado de distribución, persistida para REUTILIZAR el mismo certificado en cada build
#    (Apple solo permite 1 certificado iOS Distribution). Generarla una vez con:
#      openssl genrsa 2048
#    y pegar TODO el bloque (-----BEGIN/END-----) en Codemagic (Environment variables, secure).
#    Si ya había un certificado iOS Distribution "huérfano" (sin clave), revócalo en
#    developer.apple.com → Certificates antes del primer build con esta clave.
workflows:
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    integrations:
      app_store_connect: CoRentingCar ASC Key # <-- nombre EXACTO de tu API key (rol Admin) en Codemagic
    environment:
      groups:
        - signing # grupo de Codemagic que contiene CERTIFICATE_PRIVATE_KEY (seguro)
      vars:
        APP_STORE_APP_ID: 6776807228 # Apple ID numérico de la app
        BUNDLE_ID: "com.coretingcar.coretingcar"
        API_URL: "https://api.corentingcar.uk" # backend de producción
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Inicializar keychain
        script: keychain initialize
      - name: Firma — certificado + provisioning profile (idempotente)
        # Reutiliza el certificado iOS Distribution asociado a la clave privada
        # PERSISTIDA (CERTIFICATE_PRIVATE_KEY). Si aún no existe, lo crea con ESA
        # clave; en los siguientes builds lo reutiliza → no choca con el límite de
        # Apple (1 certificado de distribución) ni pierde la clave entre máquinas.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Añadir certificados al keychain
        script: keychain add-certificates
      - name: Aplicar perfiles al proyecto Xcode
        script: xcode-project use-profiles
      - name: Dependencias Flutter
        script: flutter pub get
      - name: Instalar Pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA (release) con la URL de producción
        script: |
          # Número de build siguiente al último de TestFlight (deben crecer).
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          flutter build ipa --release \
            --dart-define=API_URL="$API_URL" \
            --build-name=1.0.0 \
            --build-number=$(($LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:            # opcional: grupos de testers a los que repartir
        #   - Testers internos
