# Codemagic CI/CD — build iOS y publicar en TestFlight (App Store Connect).
# Requisitos:
#  - Plataforma iOS en el proyecto (ya está).
#  - Integración "App Store Connect" en Codemagic con una API key de rol **Admin**
#    (necesaria para crear certificado + provisioning profile). Su nombre debe coincidir
#    con `integrations.app_store_connect` de abajo.
#  - App creada en App Store Connect con el bundle id de abajo (su Apple ID numérico en APP_STORE_APP_ID).
workflows:
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    integrations:
      app_store_connect: CoRentingCar ASC Key # <-- nombre EXACTO de tu API key (rol Admin) en Codemagic
    environment:
      vars:
        APP_STORE_APP_ID: 6776807228 # Apple ID numérico de la app
        BUNDLE_ID: "com.coretingcar.coretingcar"
        API_URL: "https://api.corentingcar.uk" # backend de producción
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Inicializar keychain
        script: keychain initialize
      - name: Crear/obtener certificado y provisioning profile (App Store)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Añadir certificados al keychain
        script: keychain add-certificates
      - name: Aplicar perfiles al proyecto Xcode
        script: xcode-project use-profiles
      - name: Dependencias Flutter
        script: flutter pub get
      - name: Instalar Pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA (release) con la URL de producción
        script: |
          # Número de build siguiente al último de TestFlight (deben crecer).
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          flutter build ipa --release \
            --dart-define=API_URL="$API_URL" \
            --build-name=1.0.0 \
            --build-number=$(($LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:            # opcional: grupos de testers a los que repartir
        #   - Testers internos
